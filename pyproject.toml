[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "social-mood"
version = "0.1.0"
description = "Read-only collector of public posts about named public figures, with local mood scoring"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.urls]
Source = "https://github.com/yaomon/social-mood"

[tool.setuptools.packages.find]
include = ["socialmood*"]
